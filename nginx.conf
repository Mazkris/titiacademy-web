# --- Made by Inji (16 Sep 2026): madebyinji.biz.id ---
limit_req_zone $binary_remote_addr zone=mbi_prod_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=mbi_prod_umum:10m rate=120r/m;
server {
    listen 80;
    server_name madebyinji.biz.id www.madebyinji.biz.id;
    absolute_redirect off;
    client_max_body_size 2m;

    # Header keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Login: batas laju paling ketat (ditegakkan juga di aplikasi)
    location = /api/v1/auth/login {
        limit_req zone=mbi_prod_login burst=20 nodelay;
        proxy_pass http://mbi-prod-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /api/ {
        limit_req zone=mbi_prod_umum burst=40 nodelay;
        proxy_pass http://mbi-prod-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = /health {
        proxy_pass http://mbi-prod-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Dokumen API sengaja TIDAK dipublikasikan di produksi.
    location = /docs { return 404; }
    location = /openapi.json { return 404; }


    # Sisanya = platform (halaman pendaftaran publik, katalog, konfirmasi, admin).

    # Fase 9 — foto unggahan staf/Inji: disajikan aplikasi, TIDAK ikut build web.
    # Ditambahkan prod supaya menambah foto tidak perlu deploy ulang paket web.
    location /media/ {
        proxy_pass http://mbi-prod-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }

    location / {
        limit_req zone=mbi_prod_umum burst=40 nodelay;
        proxy_pass http://mbi-prod-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}

# Blok nginx untuk staging Platform Made by Inji.
# Upstream: container mbi-staging-api (jaringan titiacademy-web_default), port 8000.
# Batas laju login ditegakkan DI DUA LAPIS: di aplikasi (per akun & per IP) dan di nginx.

limit_req_zone $binary_remote_addr zone=mbi_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=mbi_umum:10m rate=120r/m;

server {
    listen 80;
    server_name staging.madebyinji.biz.id;
    absolute_redirect off;
    client_max_body_size 2m;

    # Header keamanan dasar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/auth/login {
        limit_req zone=mbi_login burst=20 nodelay;
        proxy_pass http://mbi-staging-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Rute API (dibuat oleh deploy/pasang_ingress_web.py)
    location /api/ {
        limit_req zone=mbi_umum burst=40 nodelay;
        proxy_pass http://mbi-staging-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Rute API (dibuat oleh deploy/pasang_ingress_web.py)
    location = /health {
        proxy_pass http://mbi-staging-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location = /docs {
        proxy_pass http://mbi-staging-api:8000;
