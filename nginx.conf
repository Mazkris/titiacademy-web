server {
    listen 80;
    server_name ndalempronodjiwo.com www.ndalempronodjiwo.com;
    absolute_redirect off;

    location /daftar/ {
        alias /usr/share/nginx/html/ndalem/daftar/;
        index index.html;
    }

    location = /daftar {
        return 301 /daftar/;
    }

    location /daftar/api/ {
        proxy_pass http://172.20.0.1:8766/;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://ndalem-pronodjiwo-web-backend-1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ndalem-pronodjiwo-web-frontend-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

