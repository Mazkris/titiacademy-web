services:
  titiacademy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titiacademy
    restart: unless-stopped
    expose:
    - '3000'
    environment:
    - NODE_ENV=production
  nginx:
    image: nginx:alpine
    container_name: titiacademy-nginx
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 8080:8080
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./certbot/www:/var/www/certbot:ro
    - ./certbot/conf:/etc/letsencrypt:ro
    networks:
    - default
    - pronodjiwo-shared
    - holding-dashboard_default
    - mies-prod-net
networks:
  pronodjiwo-shared:
    external: true
  holding-dashboard_default:
    external: true
  mies-prod-net:
    external: true
